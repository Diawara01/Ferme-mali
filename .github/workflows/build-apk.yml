name: Construire Ferme Mali APK

on:
  workflow_dispatch:
  push:
    branches:
      - principal

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ferme_mali

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Installer les dépendances
        run: flutter pub get

      - name: Construire l'APK
        run: flutter build apk --debug

      - name: Sauvegarder l'APK
        uses: actions/upload-artifact@v4
        with:
          name: ferme-mali-apk
          path: ferme_mali/build/app/outputs/flutter-apk/app-debug.apk
