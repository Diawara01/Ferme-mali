name: Construire Ferme Mali APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger le code
        uses: actions/checkout@v4

      - name: Décompresser le projet Flutter
        run: |
          unzip -o ferme_mali_flutter_starter.zip
          ls -la
          ls -la ferme_mali

      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.1'
          channel: stable

      - name: Installer les dépendances
        working-directory: ferme_mali
        run: flutter pub get

      - name: Construire APK
        working-directory: ferme_mali
        run: flutter build apk --debug

      - name: Sauvegarder APK
        uses: actions/upload-artifact@v4
        with:
          name: ferme-mali-test
          path: ferme_mali/build/app/outputs/flutter-apk/app-debug.apk
          - uses: actions/checkout@v5

- uses: subosito/flutter-action@v2
