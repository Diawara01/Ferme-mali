name: Construire Ferme Mali APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Construire APK
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v5

      - name: Décompresser le projet Flutter
        run: |
          ZIP=$(find . -maxdepth 1 -name "*.zip" -print -quit)
          echo "ZIP trouvé : $ZIP"
          unzip -q "$ZIP" -d .

      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable

      - name: Trouver le projet Flutter
        run: |
          echo "Recherche de pubspec.yaml..."
          find . -name pubspec.yaml -print

      - name: Installer les dépendances
        run: |
          PROJECT_DIR=$(dirname "$(find . -name pubspec.yaml -print -quit)")
          echo "Projet Flutter trouvé dans : $PROJECT_DIR"
          cd "$PROJECT_DIR"
          flutter pub get

      - name: Construire APK
        run: |
          PROJECT_DIR=$(dirname "$(find . -name pubspec.yaml -print -quit)")
          echo "Construction depuis : $PROJECT_DIR"
          cd "$PROJECT_DIR"
          flutter build apk --debug

      - name: Sauvegarder APK
        uses: actions/upload-artifact@v4
        with:
          name: ferme-mali-test
          path: "**/build/app/outputs/flutter-apk/app-debug.apk"
